[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "memex-zero-rag"
version = "1.0.0"
description = "Zero-RAG personal knowledge base — the Karpathy LLM Wiki pattern, production-ready"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Joerg Peetz" }
]
keywords = ["mcp", "knowledge-base", "llm-wiki", "rag", "claude-code"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Markdown",
    "Topic :: Database :: Front-Ends",
]

dependencies = [
    "mcp>=0.9.0,<2.0",
    "pyyaml>=6.0",
    "httpx>=0.26.0",
]

[project.optional-dependencies]
sse = [
    "uvicorn>=0.27.0",
    "starlette>=0.36.0",
    "sse-starlette>=1.8.0",
]
search = [
    "sentence-transformers>=2.2.0",
]
pdf = [
    "pymupdf>=1.24.0",
]
web = [
    "readability-lxml>=0.8.1",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
]
voice = [
    "openai-whisper>=20231117",
    "sounddevice>=0.4.6",
    "soundfile>=0.12.0",
    "numpy>=1.24.0",
]
batch = [
    "anthropic>=0.18.0",
]
all = [
    "memex-zero-rag[sse,search,pdf,web,voice,batch]",
]

dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
[tool.bandit]
# B608 (SQL built by string construction) is a heuristic that cannot see validation.
# Every interpolated identifier in pg_backend.py passes _safe_ident() (\A...\Z anchored)
# and is covered by tests/test_pg_identifier_safety.py. Values are always bound
# parameters. If a new query interpolates anything other than a validated identifier,
# that is a review failure, not a scanner failure.
skips = ["B608"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Error-class rules only for now: syntax errors, undefined names, broken f-strings,
# comparison mistakes. Style is deliberately not gated yet — a 149-finding style diff
# buried in a security fix is how security fixes get reverted.
select = ["E9", "F63", "F7", "F82"]
