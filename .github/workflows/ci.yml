name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Deliberately minimal: the suite needs only the SDK, yaml and the test runners.
      # Torch / sentence-transformers are optional extras and must not gate a unit test run.
      - name: Install test dependencies
        run: |
          python -m pip install -U pip
          pip install "mcp>=0.9,<2.0" pyyaml numpy pytest pytest-asyncio ruff pip-audit

      - name: Tests
        run: python -m pytest -q

      # Error-class rules only (syntax, undefined names, broken f-strings). The repo is not
      # style-linted yet; raising that to a full ruleset is a separate, reviewable change.
      - name: Lint
        run: ruff check --select E9,F63,F7,F82 memex_mcp

      # --strict: a SKIP is not a PASS. ruff/pip-audit/pytest are installed above precisely so
      # that the gate has no excuses left.
      - name: MCP engineering gate
        run: python tools/mcp_gate.py . --strict

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install scanners
        run: |
          python -m pip install -U pip
          pip install bandit pip-audit detect-secrets
      - name: SAST
        run: bandit -c pyproject.toml -r memex_mcp -ll -q
      - name: Dependency audit
        run: pip-audit -r requirements.txt || pip-audit
      # Baseline records findings that were reviewed and accepted (currently two documented
      # DSN placeholders in the READMEs). Anything NEW fails the build.
      - name: Secret scan (new findings only)
        run: python tools/secret_delta.py

